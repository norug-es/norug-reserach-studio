services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-norug_research}
      POSTGRES_USER: ${POSTGRES_USER:-norug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-norug_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-this-app-password}
    volumes:
      - postgres-v05-data:/var/lib/postgresql
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  research-studio:
    build: .
    ports:
      - "3034:3034"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-replace-this-before-production}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3034}
      IDENTITY_WEBHOOK_URL: ${IDENTITY_WEBHOOK_URL:-}
      IDENTITY_WEBHOOK_SECRET: ${IDENTITY_WEBHOOK_SECRET:-replace-this-before-production}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-norug_app}:${POSTGRES_APP_PASSWORD:-change-this-app-password}@postgres:5432/${POSTGRES_DB:-norug_research}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3034/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-v05-data:
