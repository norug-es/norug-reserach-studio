services:
  research-studio:
    build: .
    ports:
      - "3034:3034"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@norug.es}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-norug-demo}
      AUTH_SECRET: ${AUTH_SECRET:-replace-this-before-production}
      DATABASE_PATH: /app/data/research-studio.db
    volumes:
      - research-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3034/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  research-data:
