services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-norug_research}
      POSTGRES_USER: ${POSTGRES_USER:-norug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-norug_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-this-app-password}
    volumes:
      - postgres-v05-data:/var/lib/postgresql
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-v06-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-v061-data:/var/lib/clamav
    restart: unless-stopped

  transcriber:
    build:
      context: .
      dockerfile: docker/transcriber/Dockerfile
      target: cpu
    ports:
      - "127.0.0.1:${TRANSCRIBER_PORT:-8088}:8080"
    environment:
      TRANSCRIBER_API_KEY: ${TRANSCRIBER_API_KEY:-change-this-transcriber-key}
      TRANSCRIBER_MAX_BYTES: ${TRANSCRIBER_MAX_BYTES:-52428800}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-1}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_PRELOAD: ${WHISPER_PRELOAD:-false}
      WHISPER_MODEL_CACHE: /models
    volumes:
      - whisper-models-v062:/models
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-norug-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes:
      - minio-v06-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  research-studio:
    build:
      context: .
      target: runner
    ports:
      - "3034:3034"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-replace-this-before-production}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3034}
      IDENTITY_WEBHOOK_URL: ${IDENTITY_WEBHOOK_URL:-}
      IDENTITY_WEBHOOK_SECRET: ${IDENTITY_WEBHOOK_SECRET:-replace-this-before-production}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-norug_app}:${POSTGRES_APP_PASSWORD:-change-this-app-password}@postgres:5432/${POSTGRES_DB:-norug_research}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-norug-research}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-norug-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKET: "true"
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3034/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ingestion-worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-norug_app}:${POSTGRES_APP_PASSWORD:-change-this-app-password}@postgres:5432/${POSTGRES_DB:-norug_research}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-5}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-10000}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-120000}
      EXTRACTED_TEXT_MAX_CHARS: ${EXTRACTED_TEXT_MAX_CHARS:-10000000}
      TRANSCRIBER_URL: http://transcriber:8080
      TRANSCRIBER_API_KEY: ${TRANSCRIBER_API_KEY:-change-this-transcriber-key}
      TRANSCRIBER_TIMEOUT_MS: ${TRANSCRIBER_TIMEOUT_MS:-3600000}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-norug-research}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-norug-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      S3_FORCE_PATH_STYLE: "true"
      S3_AUTO_CREATE_BUCKET: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      transcriber:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-v05-data:
  redis-v06-data:
  minio-v06-data:
  clamav-v061-data:
  whisper-models-v062:
