services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-norug_research}
      POSTGRES_USER: ${POSTGRES_USER:-norug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  research-studio:
    build: .
    ports:
      - "3034:3034"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@norug.es}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-norug-demo}
      AUTH_SECRET: ${AUTH_SECRET:-replace-this-before-production}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-norug}:${POSTGRES_PASSWORD:-change-this-database-password}@postgres:5432/${POSTGRES_DB:-norug_research}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3034/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres18-data:
